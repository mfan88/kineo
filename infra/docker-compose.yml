# Kineō server stack. Run from the repo root with:
#   docker compose --env-file infra/kineo.env -f infra/docker-compose.yml up -d
# (infra/setup.sh and kineo.service do this for you.)
#
# Its own Compose project ("kineo"), so containers, volumes and networks never mix
# with other stacks on the machine. Every port is bound to 127.0.0.1: nothing is
# reachable from outside except through the host's Caddy (infra/caddy/kineo.caddy).
#
# PowerSync streams each signed-in practitioner's rows to their devices. It reads
# changes from the `powersync` publication and keeps its own data in the separate
# powersync_storage database on the same server.
#
# Not included, on purpose:
#   - Supabase Auth: sign-in is Clerk. PostgREST and Storage verify Clerk tokens
#     directly with JWT_JWKS.
#   - Supabase's API gateway: the host Caddy routes /rest/v1 and /storage/v1.
#   - Realtime, Edge Functions, analytics, image transformation: not used.

name: kineo

services:
  db:
    image: supabase/postgres:17.11.0.004
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/kineo.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
      POWERSYNC_DB_PASSWORD: ${POWERSYNC_DB_PASSWORD:?Set POWERSYNC_DB_PASSWORD in infra/kineo.env}
      POWERSYNC_STORAGE_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD:?Set POWERSYNC_STORAGE_PASSWORD in infra/kineo.env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ./db/init/98-roles.sql:/docker-entrypoint-initdb.d/init-scripts/98-roles.sql:ro
      - ./db/init/98-jwt.sql:/docker-entrypoint-initdb.d/init-scripts/98-jwt.sql:ro
      - ./db/init/99-auth-jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-auth-jwt.sql:ro
      - ./db/init/99-powersync.sql:/docker-entrypoint-initdb.d/init-scripts/99-powersync.sql:ro
    ports:
      # Local only: for backups, psql and setup.sh. Never proxied.
      - 127.0.0.1:${KINEO_DB_PORT:-55324}:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      # Clerk's public keys plus the stack's own HS256 key, as one JWKS.
      PGRST_JWT_SECRET: ${JWT_JWKS:?Set JWT_JWKS in infra/kineo.env (infra/setup.sh builds it)}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    ports:
      - 127.0.0.1:${KINEO_REST_PORT:-55321}:3000
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3

  storage:
    image: supabase/storage-api:v1.89.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:?Set ANON_KEY in infra/kineo.env}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY in infra/kineo.env}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/kineo.env}
      JWT_JWKS: ${JWT_JWKS}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.getkineo.work}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      # Logos and invoice PDFs are small; 10 MB leaves room.
      FILE_SIZE_LIMIT: 10485760
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: kineo
      TENANT_ID: kineo
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    ports:
      - 127.0.0.1:${KINEO_STORAGE_PORT:-55322}:5000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  meta:
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?Set PG_META_CRYPTO_KEY in infra/kineo.env}

  studio:
    image: supabase/studio:2026.11.02-sha-a05e7ec
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public,storage
      DEFAULT_ORGANIZATION_NAME: Kineō
      DEFAULT_PROJECT_NAME: Kineō
      SUPABASE_URL: http://rest:3000
      SUPABASE_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.getkineo.work}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
    ports:
      # Admin dashboard: local only. Reach it with an SSH tunnel or Tailscale.
      - 127.0.0.1:${KINEO_STUDIO_PORT:-55323}:3000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/platform/profile'').then((r) => {if (r.status !== 200) throw new Error(r.status)})"',
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s

  powersync:
    image: journeyapps/powersync-service:1.28.2
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_PORT: 8080
      PS_DATA_SOURCE_URI: postgresql://powersync_role:${POWERSYNC_DB_PASSWORD}@db:5432/postgres
      PS_STORAGE_SOURCE_URI: postgresql://powersync_storage_user:${POWERSYNC_STORAGE_PASSWORD}@db:5432/powersync_storage
      PS_JWKS_URL: https://${CLERK_DOMAIN:?Set CLERK_DOMAIN in infra/kineo.env}/.well-known/jwks.json
      PS_JWT_AUDIENCE: ${POWERSYNC_JWT_AUDIENCE:?Set POWERSYNC_JWT_AUDIENCE in infra/kineo.env}
    volumes:
      - ./powersync:/config:ro
    ports:
      - 127.0.0.1:${KINEO_SYNC_PORT:-55325}:8080
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/probes/liveness').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

# All data lives in folders under KINEO_DATA_DIR (e.g. /mnt/nvme/kineo), created by
# setup.sh. Bind-style volumes: if the folder is missing (say the SSD isn't mounted),
# the container fails to start instead of starting on an empty database.
volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${KINEO_DATA_DIR:?Set KINEO_DATA_DIR in infra/kineo.env}/db
  db-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${KINEO_DATA_DIR}/db-config
  storage-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${KINEO_DATA_DIR}/storage
