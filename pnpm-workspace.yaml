# Kineō monorepo workspace
# Every folder matched here is a package pnpm installs and links together.
packages:
  - "apps/*" # @kineo/mobile (Expo), @kineo/desktop (Tauri)
  - "packages/*" # @kineo/shared, @kineo/data, @kineo/tokens, @kineo/invoice-template, @kineo/config

# React Native / Expo's Metro bundler expects a flat node_modules layout.
nodeLinker: hoisted

# Use your local packages (workspace:*) instead of anything with the same name on npm.
linkWorkspacePackages: true

# Install missing peer dependencies automatically and warn (rather than fail)
# on version mismatches; Expo and HeroUI Native have many peer dependencies.
strictPeerDependencies: false
autoInstallPeers: true

# pnpm blocks install scripts from dependencies by default.
# Run `pnpm approve-builds` after your first install and approve only
# what the apps need (typically esbuild and a few Expo/Tauri tools).
# Your approvals are saved here automatically.

# Clerk's dependencies ship install scripts that only print notices; they work without them.
allowBuilds:
  "@clerk/shared": false
  browser-tabs-lock: false
  core-js: false
  # A file watcher used by Jest's tooling; its script only builds from source when
  # no prebuilt binary fits (one does, as @parcel/watcher-<platform>).
  "@parcel/watcher": false
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.20"
  - "@expo/config-plugins@58.0.13"
  - "@expo/config@58.0.12"
  - "@expo/env@2.6.0"
  - "@expo/fingerprint@0.21.10"
  - "@expo/image-utils@0.12.7"
  - "@expo/inline-modules@0.2.10"
  - "@expo/local-build-cache-provider@58.0.12"
  - "@expo/metro-config@58.0.22"
  - "@expo/metro-file-map@58.0.6"
  - "@expo/plist@0.10.2"
  - "@expo/prebuild-config@58.0.20"
  - "@expo/require-utils@58.0.6"
  - "@expo/router-server@58.0.22"
  - babel-preset-expo@58.0.25
  - expo-asset@58.0.21
  - expo-constants@58.0.16
  - expo-font@58.0.12
  - expo-keep-awake@58.0.4
  - expo-modules-autolinking@58.1.0
  - expo-modules-cli@0.5.0
  - expo-modules-core@58.1.0
  - expo-modules-jsi@58.0.23
  - expo-server@58.1.0
  - expo-status-bar@58.0.5
  - expo@58.0.24
  - expo-linking@58.0.17
  - expo-router@58.0.31
  - expo-blur@58.0.6
  - expo-splash-screen@58.0.14

# One React for every app: the phone app's Expo SDK needs exactly this version, and
# with the hoisted layout a second copy breaks react-dom (it requires a matching react).
# Raise these together when Expo's SDK moves to a newer React.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
